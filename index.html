<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mercy</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    overflow:hidden;
    font-family:'Poppins', sans-serif;
    background: radial-gradient(ellipse at top, #0b1030 0%, #05070f 60%, #020208 100%);
    color:#f1e9ff;
  }
  .scene {
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
  }

  /* stars */
  .stars, .stars2 {
    position:absolute; inset:0;
    background-repeat:repeat;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90px 120px, #fff, transparent),
      radial-gradient(1px 1px at 150px 60px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 220px 190px, #fff, transparent),
      radial-gradient(1px 1px at 280px 40px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 320px 150px, #fff, transparent),
      radial-gradient(1px 1px at 60px 200px, #fff, transparent);
    background-size:360px 240px;
    opacity:0.7;
    animation:twinkle 4s ease-in-out infinite alternate;
  }
  .stars2 { background-size:480px 320px; opacity:0.4; animation-duration:6s; }
  @keyframes twinkle { from{opacity:.3;} to{opacity:.85;} }

  .moon {
    position:absolute; top:8%; right:12%;
    width:70px; height:70px; border-radius:50%;
    background:#cfd6e8;
    box-shadow:0 0 14px 3px rgba(207,214,232,.3), 0 0 30px 10px rgba(207,214,232,.08);
    opacity:0;
    transition:opacity 2.5s ease;
  }
  .moon.show { opacity:1; }

  /* shooting star */
  .shooting-star {
    position:absolute;
    top:22%; left:-10%;
    width:2px; height:2px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 6px 2px #fff;
    opacity:0;
  }
  .shooting-star::before {
    content:"";
    position:absolute;
    top:50%; right:0;
    width:140px; height:1px;
    background:linear-gradient(to left, rgba(255,255,255,.9), transparent);
    transform:translateY(-50%);
  }
  .shooting-star.fly {
    animation:shoot 2.2s cubic-bezier(.3,.6,.3,1) forwards;
  }
  @keyframes shoot {
    0%   { opacity:0; transform:translate(0,0); }
    8%   { opacity:1; }
    90%  { opacity:1; }
    100% { opacity:0; transform:translate(120vw, 40vh); }
  }

  .content {
    position:relative;
    z-index:5;
    width:90%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* Gate */
  #gate { display:flex; flex-direction:column; align-items:center; gap:22px; }
  #gate p { font-weight:300; font-size:18px; opacity:.85; letter-spacing:.5px; }
  #gate #visitLine {
    font-size:20px;
    opacity:1;
    color:#ffc2d4;
    max-width:480px;
    line-height:1.6;
  }
  #beginBtn {
    padding:14px 38px;
    border:1px solid rgba(255,255,255,.35);
    background:transparent;
    color:#f1e9ff;
    border-radius:40px;
    font-size:15px;
    letter-spacing:1px;
    cursor:pointer;
    transition:.4s;
    margin-top:8px;
  }
  #beginBtn:hover { background:rgba(255,255,255,.08); transform:scale(1.03); }

  /* Name */
  #nameWrap { min-height:100px; display:flex; align-items:center; justify-content:center; }
  #name {
    font-family:'Great Vibes', cursive;
    font-size:64px;
    color:#d9b8c4;
    text-shadow:0 0 10px rgba(217,184,196,.35), 0 0 24px rgba(217,184,196,.15);
  }

  /* Typing message */
  #typingWrap { min-height:120px; display:flex; align-items:center; justify-content:center; margin-top:10px; }
  #typing {
    font-size:22px;
    font-weight:300;
    line-height:1.7;
    max-width:520px;
  }

  /* Ending */
  #ending {
    display:none;
    opacity:0;
    transition:opacity 2s ease;
  }
  #ending.show { opacity:1; }
  #ending h1 {
    font-family:'Great Vibes', cursive;
    font-size:64px;
    font-weight:400;
    color:#ffc2d4;
    text-shadow:0 0 14px rgba(255,143,179,.45), 0 0 34px rgba(255,143,179,.2);
    line-height:1.3;
  }

  .hidden { display:none !important; }

  /* floating hearts */
  .heart {
    position:absolute;
    bottom:-30px;
    font-size:22px;
    color:#ff8fb3;
    animation:float 5s linear forwards;
    pointer-events:none;
  }
  @keyframes float {
    from { transform:translateY(0) scale(.6); opacity:1; }
    to   { transform:translateY(-110vh) scale(1.4); opacity:0; }
  }

  @media (max-width:600px) {
    #name { font-size:46px; }
    #typing { font-size:18px; }
    #gate #visitLine { font-size:18px; }
    #ending h1 { font-size:46px; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="moon" id="moon"></div>
  <div class="shooting-star" id="shootingStar"></div>
  <div id="heartsLayer"></div>

  <div class="content">

    <div id="gate">
      <p>This is for you, Mercy.</p>
      <p id="visitLine"></p>
      <button id="beginBtn">begin</button>
    </div>

    <div id="main" class="hidden">
      <div id="nameWrap"><h1 id="name"></h1></div>
      <div id="typingWrap"><div id="typing"></div></div>
    </div>

    <div id="ending">
      <h1>I love you, Mercy 😊</h1>
    </div>

  </div>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- EmailJS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
  // ============= EMAILJS =============
  const EMAILJS_PUBLIC_KEY  = "92moMobNEnuZk-ze2";
  const EMAILJS_SERVICE_ID  = "service_hg5mwdh";
  const EMAILJS_TEMPLATE_ID = "template_puaarju";
  // ===================================

  if (window.emailjs && EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
    emailjs.init(EMAILJS_PUBLIC_KEY);
  }

  const gate = document.getElementById('gate');
  const main = document.getElementById('main');
  const nameEl = document.getElementById('name');
  const typingEl = document.getElementById('typing');
  const ending = document.getElementById('ending');
  const music = document.getElementById('music');
  music.volume = 0.3;
  const moon = document.getElementById('moon');
  const shootingStar = document.getElementById('shootingStar');
  const heartsLayer = document.getElementById('heartsLayer');
  const visitLine = document.getElementById('visitLine');

  const NAME = "Mercy";

  // ---------- Visit counter ----------
  // Counts ONE visit per day, per device/browser (a refresh the same day doesn't count).
  // Saved in her browser, so your own tests on your device never touch hers.
  // PREVIEW: add ?visit=5 to the URL to preview visit 5 (any number) without counting.
  let visitCount = 1;
  const preview = parseInt(new URLSearchParams(location.search).get('visit'), 10);

  if (preview > 0) {
    visitCount = preview;
  } else {
    try {
      const today = new Date().toDateString();
      const lastDay = localStorage.getItem('mercyLastDay');
      let count = parseInt(localStorage.getItem('mercyVisits'), 10) || 0;
      if (lastDay !== today) {
        count += 1;
        localStorage.setItem('mercyVisits', String(count));
        localStorage.setItem('mercyLastDay', today);
      }
      visitCount = count || 1;
    } catch (e) { visitCount = 1; }
  }

  // ---------- 8 visit openings ----------
  const visitMessages = [
    " I made this just for you 🤍",
    "I keep looking at your photos. Can you blame me? 😊",
    "Some things only show up the third time ✨",
    "Guess what I was thinking while I made this?",
    "Do you know how many times you pop up in my mind? 🤔",
    "Take a guess, Mercy 😊",
    "Hint: it's more than you think 🤫",
    "Eight. Okay, more like eight hundred. 🍀 You're my favorite thought."
  ];
  const afterEight = "Still here, still yours 🤍";

  visitLine.textContent = visitCount <= 8 ? visitMessages[visitCount - 1] : afterEight;

  // ---------- Main message ----------
  const messages = [
    "Mercy...",
    "I'm not sure how to say this, so I'll keep it simple.",
    "We haven't met yet.",
    "But you already make my days softer.",
    "Strangers probably think I'm odd.",
    "I keep smiling at my phone like a fool, and it's your fault.",
    "You don't have to say anything.",
    "You don't have to answer anything.",
    "I just wanted you to know...",
    "that you matter to me. A lot.",
    "I can't wait for the day I finally get to see that smile in person."
  ];

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function typeText(el, text, speed = 55) {
    for (let i = 0; i <= text.length; i++) {
      el.textContent = text.slice(0, i);
      await sleep(speed);
    }
  }

  async function eraseText(el, speed = 30) {
    const text = el.textContent;
    for (let i = text.length; i >= 0; i--) {
      el.textContent = text.slice(0, i);
      await sleep(speed);
    }
  }

  async function typeName() {
    for (let i = 0; i <= NAME.length; i++) {
      nameEl.textContent = NAME.slice(0, i);
      await sleep(160);
    }
  }

  function spawnHearts(count = 30) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = '❤';
        h.style.left = Math.random() * 100 + 'vw';
        h.style.fontSize = (14 + Math.random() * 20) + 'px';
        h.style.animationDuration = (4 + Math.random() * 3) + 's';
        heartsLayer.appendChild(h);
        setTimeout(() => h.remove(), 7000);
      }, i * 150);
    }
  }

  async function runSequence() {
    shootingStar.classList.add('fly');
    await sleep(900);
    moon.classList.add('show');
    await sleep(2000);
    music.play().catch(() => {});
    await sleep(600);

    await typeName();
    await sleep(700);

    for (let i = 0; i < messages.length; i++) {
      const isLast = i === messages.length - 1;
      await typeText(typingEl, messages[i]);
      await sleep(isLast ? 2200 : 1000);
      await eraseText(typingEl);
      await sleep(250);
    }

    // Ending: clear the screen, show the final line
    main.classList.add('hidden');
    ending.style.display = 'block';
    requestAnimationFrame(() => ending.classList.add('show'));
    spawnHearts(40);
    sendNotice("Reached the end 💌");
  }

  // Sends you an email. Choice text includes her visit number.
  // To see it as its own field, add {{visit}} to your EmailJS template (optional).
  function sendNotice(choice) {
    if (window.emailjs && EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
      emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        choice: choice + " (visit #" + visitCount + ")",
        visit: visitCount,
        time: new Date().toLocaleString()
      }).catch(err => console.error("EmailJS error:", err));
    }
  }

  document.getElementById('beginBtn').addEventListener('click', () => {
    sendNotice("Opened the website 👀");
    gate.classList.add('hidden');
    main.classList.remove('hidden');
    runSequence();
  });
</script>
</body>
</html>
